<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InPost Proof of Delivery Without App | Get Photo POD via Email</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --dark-color: #111111;
            --light-color: #f9f9f9;
            --border-color: #cccccc;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--light-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 650px; margin: 40px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        header h1 { font-size: 1.8rem; color: var(--dark-color); margin-bottom: 10px; border-bottom: 3px solid var(--primary-color); padding-bottom: 10px; }
        .campaign-text { background-color: #fff9e6; border-left: 4px solid var(--primary-color); padding: 15px; margin: 20px 0; border-radius: 4px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; }
        .error-message { color: #d93025; font-size: 0.85rem; margin-top: 5px; display: none; }
        .btn { display: block; width: 100%; background-color: var(--dark-color); color: #ffffff; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; }
        footer { text-align: center; margin-top: 40px; font-size: 0.8rem; color: #777777; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>Get Your InPost POD Without the App</h1></header>
    <div class="campaign-text">
        <p><strong>Why is photo proof locked away?</strong> Request your InPost proof of delivery via an automated email link without installing the app.</p>
    </div>
    <form id="podForm" onsubmit="generatePodEmail(event)">
        <div class="form-group">
            <label for="fullName">Your Full Name</label>
            <input type="text" id="fullName" required placeholder="e.g. Alex Smith">
        </div>
        <div class="form-group">
            <label for="trackingRef">InPost Tracking Reference</label>
            <input type="text" id="trackingRef" required placeholder="e.g. 642100000000000000000000">
            <div id="trackingError" class="error-message">Please check your tracking number format.</div>
        </div>
        <div class="form-group">
            <label for="postcode">Delivery Postcode</label>
            <input type="text" id="postcode" required placeholder="e.g. SW1A 1AA">
        </div>
        <button type="submit" class="btn">Generate Email to Customer Services</button>
    </form>
    <footer><p>No server data storage — formats locally on your device.</p></footer>
</div>
<script>
function generatePodEmail(event) {
    event.preventDefault();
    const name = document.getElementById('fullName').value.trim();
    const tracking = document.getElementById('trackingRef').value.trim().toUpperCase();
    const postcode = document.getElementById('postcode').value.trim().toUpperCase();
    const errorDiv = document.getElementById('trackingError');
    const pattern = /^[A-Z0-9]{10,26}$/;
    if (!pattern.test(tracking)) { errorDiv.style.display = 'block'; return; }
    errorDiv.style.display = 'none';
    const recipient = "help@inpost.co.uk";
    const subject = `Official POD Request - Tracking Ref: ${tracking}`;
    const body = `Dear InPost Customer Support,\n\nI am requesting the formal Proof of Delivery (POD) for tracking: ${tracking}, postcode: ${postcode}, recipient: ${name}.\n\nRegards,\n${name}`;
    window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
</script>
</body>
</html>
